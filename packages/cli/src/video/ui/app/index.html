<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video workbench · Slides</title>
    <link rel="stylesheet" href="./app.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="wb-header">
      <div>
        <h1 data-zh="视频制作">Video workbench</h1>
      </div>
      <button type="button" id="language">简体中文</button>
      <div class="wb-header-meta" id="wb-meta"></div>
    </header>
    <main class="wb-layout">
      <aside class="wb-panel wb-decks">
        <h2 class="wb-picker-heading" data-zh="演示文稿">Decks</h2>
        <ul id="wb-deck-list" class="wb-deck-list"></ul>
      </aside>
      <section class="wb-panel wb-main">
        <div id="wb-deck-empty" class="wb-empty" data-zh="选择一份文稿，查看时间轴。">Select a deck to view its timeline.</div>
        <div id="wb-deck-view" hidden>
          <div class="wb-deck-title">
            <h2 id="wb-deck-name"></h2>
            <span id="wb-deck-timeline-badge" class="wb-badge" hidden data-zh="时间轴">Timeline</span>
          </div>
          <h3 data-zh="预览">Preview</h3>
          <div class="wb-preview-shell">
            <div id="wb-preview-stage" class="wb-preview-stage"></div>
            <div class="wb-preview-controls">
              <button id="wb-play" type="button" data-zh="播放">Play</button>
              <input id="wb-scrubber" aria-label="Frame position" data-zh-label="播放进度（帧）" type="range" min="0" max="0" value="0" step="1" />
              <span id="wb-frame-label" class="wb-muted" data-zh="第0帧 / 共0帧">Frame 0 / 0</span>
              <label class="wb-stop-jump"><span data-zh="步骤">Step</span><select id="wb-stop-select"></select></label>
            </div>
            <p id="wb-preview-error" class="wb-error" hidden></p>
          </div>
          <h3><span data-zh="时间轴">Timeline</span> <span class="wb-muted" id="wb-timeline-summary"></span></h3>
          <div id="wb-timeline" class="wb-timeline"></div>
          <h3><span data-zh="观众席">Audience</span> <button id="wb-refresh-audience" type="button" class="wb-small" data-zh="刷新">Refresh</button> <span class="wb-muted" id="wb-audience-summary"></span></h3>
          <div id="wb-audience" class="wb-audience"><p class="wb-muted" data-zh="正在读取排练记录…">Loading rehearsals…</p></div>
          <h3 data-zh="导出视频">Export video</h3>
          <div class="wb-render-row">
            <select id="wb-backend-select" aria-label="Video engine" data-zh-label="视频引擎"></select>
            <button id="wb-render" type="button" data-zh="导出 MP4">Export MP4</button>
            <span id="wb-render-status" class="wb-muted"></span>
          </div>
          <pre id="wb-render-log" class="wb-log" hidden></pre>
          <h3><span data-zh="导出文件">Exported files</span> <button id="wb-refresh-artifacts" type="button" class="wb-small" data-zh="刷新">Refresh</button></h3>
          <div id="wb-artifacts" class="wb-artifacts"></div>
          <div id="wb-artifact-preview" class="wb-artifact-preview"></div>
        </div>
      </section>
    </main>
  </body>
</html>
